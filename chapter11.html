<header><small>BAYLOR UNIVERSITY · NUTR 2351 · EXAM 3</small><h1>Chapter 11: Water</h1><p>Explore fluid balance, hydration, electrolytes, and the body's regulation of water. Practice applying these concepts to everyday and clinical situations.</p><div class="progress"><div id="progressText">0 of 40 challenges correct</div><div class="track"><div id="bar"></div></div></div></header>
<div class="layout"><nav id="nav" aria-label="Study guide sections"></nav><main><div id="content"></div><div class="controls"><button id="previous">← Previous section</button><button id="next">Next section →</button></div></main></div>
<script>
'use strict';
const sections=[
['Start here'],
['Water fundamentals',
['Water as an essential nutrient','Water is required for life and participates in nearly every physiological system. It does not provide calories, but it is essential for nutrient transport, chemical reactions, waste removal, and temperature regulation.'],
['Body composition','Water accounts for approximately 50–60% of adult body weight on average, although the proportion varies with age, sex, and body composition. Lean tissue contains proportionally more water than adipose tissue.'],
['Body fluid compartments','Intracellular fluid is located inside cells and accounts for approximately two-thirds of total body water. Extracellular fluid includes interstitial fluid and blood plasma.'],
['Temperature regulation','Water helps regulate body temperature through its heat capacity and through evaporative cooling when sweat evaporates from the skin.'],
['Water sources','Water comes from beverages, foods, and a smaller amount produced during metabolism. Fruits, vegetables, soups, and other foods can contribute substantially to total intake.']],
['Fluid balance and regulation',
['Water balance','Fluid balance depends on water entering and leaving the body. Intake occurs through beverages, foods, and metabolic water; losses occur through urine, skin, lungs, and feces.'],
['Thirst','Thirst is stimulated by changes such as increased plasma osmolality and reduced circulating volume. It helps motivate fluid intake but may be less reliable in some populations.'],
['Antidiuretic hormone','Antidiuretic hormone (ADH), also called vasopressin, promotes water reabsorption by the kidneys, reducing urinary water losses.'],
['Aldosterone','Aldosterone promotes renal sodium reabsorption. Water may follow sodium, helping support extracellular fluid volume.'],
['The kidneys','The kidneys adjust urine concentration and volume to help maintain fluid and electrolyte balance.'],
['Osmosis','Osmosis is the movement of water across a selectively permeable membrane toward the side with a higher effective concentration of dissolved particles.']],
['Hydration and disturbances',
['Dehydration','Dehydration occurs when body water losses exceed replacement. Symptoms can include thirst, reduced urine output, dark urine, fatigue, dizziness, and impaired performance.'],
['Risk factors','Fever, vomiting, diarrhea, heavy sweating, inadequate fluid access, and some medications can increase dehydration risk.'],
['Fluid losses during exercise','Sweating helps cool the body but causes water and electrolyte losses. Replacement needs vary with activity duration, intensity, environment, and individual sweat rate.'],
['Overhydration','Excessive water intake relative to the body’s ability to excrete water can dilute blood sodium concentration and contribute to hyponatremia.'],
['Hyponatremia','Hyponatremia means a low blood sodium concentration. Severe cases may produce headache, confusion, seizures, or other neurologic symptoms and require urgent medical evaluation.'],
['Urine as a clue','Urine color and volume can provide useful clues about hydration, but they are not definitive measures. Supplements, medications, foods, and medical conditions can affect urine appearance.']],
['Hydration across the lifespan',
['Infants','Infants have relatively high water needs per kilogram of body weight and can be vulnerable to dehydration. Their fluid needs should be met through age-appropriate feeding practices.'],
['Older adults','Older adults may experience reduced thirst sensation, changes in kidney function, or barriers to obtaining fluids, increasing dehydration risk.'],
['Pregnancy and lactation','Fluid needs increase during pregnancy and lactation. Breast milk production contributes to increased water requirements during lactation.'],
['Illness','Vomiting, diarrhea, fever, and some medical conditions can alter water and electrolyte needs. Significant losses may require oral rehydration solutions or medical treatment.'],
['Adequate Intake','Total water Adequate Intake values for adults are approximately 3.7 liters per day for men and 2.7 liters per day for women. These values include water from both beverages and foods and are not universal individual requirements.'],
['Individual variation','Fluid needs depend on body size, dietary intake, climate, activity, health status, and other factors. No single water recommendation fits every person.']],
['Matching lab'],['Mastery challenge']
];
const questions=[
[1,'Function','Which function of water is especially important during physical activity?',['Providing calories','Evaporative cooling through sweat','Storing fat','Producing vitamin D'],1,'Sweat evaporation removes heat and helps regulate body temperature.'],
[1,'Body composition','Which tissue generally contains a higher proportion of water?',['Adipose tissue','Lean muscle tissue','Stored triglyceride','Bone mineral'],1,'Lean tissue contains proportionally more water than adipose tissue.'],
[1,'Compartments','Most total body water is located:',['Inside cells','In blood plasma','In the digestive tract','Outside all cells'],0,'Approximately two-thirds of total body water is intracellular.'],
[1,'Extracellular fluid','Which fluid is part of the extracellular compartment?',['Cytoplasm','Blood plasma','Fluid inside muscle cells','Intracellular fluid'],1,'Plasma and interstitial fluid are components of extracellular fluid.'],
[1,'Sources','Which contributes to total daily water intake?',['Beverages only','Foods and beverages','Only plain drinking water','Only metabolic water'],1,'Total water intake includes beverages, foods, and metabolic water.'],
[1,'Energy','How many calories does plain water provide?',['0','4 per gram','7 per gram','9 per gram'],0,'Water is essential but does not supply energy.'],
[2,'Balance','Which process represents a normal route of water loss?',['Urination','Vitamin absorption','Protein synthesis','Glycogen storage'],0,'Water is lost through urine, skin, lungs, and feces.'],
[2,'Thirst','Increased plasma osmolality commonly stimulates:',['Thirst','Reduced respiratory rate','Vitamin synthesis','Bone formation'],0,'An increase in plasma osmolality is an important thirst stimulus.'],
[2,'ADH','Which hormone directly promotes water reabsorption by the kidneys?',['Insulin','ADH','Glucagon','Calcitonin'],1,'ADH helps conserve body water by increasing renal water reabsorption.'],
[2,'Aldosterone','Aldosterone primarily promotes renal reabsorption of:',['Sodium','Vitamin C','Glucose exclusively','Dietary fat'],0,'Aldosterone increases sodium reabsorption, influencing fluid volume.'],
[2,'Kidneys','Which organ plays the primary role in adjusting urine concentration?',['Liver','Kidneys','Pancreas','Stomach'],1,'The kidneys regulate urinary water and electrolyte excretion.'],
[2,'Osmosis','Water moves by osmosis toward a region with:',['Higher effective solute concentration','Lower effective solute concentration','No dissolved particles','Higher temperature only'],0,'Osmosis moves water toward higher effective solute concentration across a selectively permeable membrane.'],
[3,'Dehydration','Which combination suggests possible dehydration?',['Thirst and reduced urine output','Increased urine output after drinking water','Normal fluid balance','Increased saliva production'],0,'Thirst and decreased urine output are common dehydration clues.'],
[3,'Risk','Which situation can substantially increase fluid losses?',['Persistent diarrhea','Sleeping in a cool room','Reading quietly','Eating a balanced meal'],0,'Diarrhea can cause significant water and electrolyte losses.'],
[3,'Exercise','Why does heavy sweating increase fluid requirements?',['Sweat causes water and electrolyte losses','Sweat produces dietary water','Sweat prevents heat loss','Sweat eliminates all sodium'],0,'Sweating removes heat but also causes fluid and electrolyte losses.'],
[3,'Overhydration','Drinking excessive water without adequate excretion can contribute to:',['Hyponatremia','Vitamin A toxicity','Pellagra','Scurvy'],0,'Excess water can dilute blood sodium concentration.'],
[3,'Safety','Which symptom in a person with suspected severe hyponatremia warrants urgent medical attention?',['Seizures','Mild hunger','Temporary hiccups','Normal thirst'],0,'Severe hyponatremia may cause dangerous neurologic complications.'],
[3,'Assessment','Which statement about urine color is most accurate?',['It is a useful clue but not a definitive hydration test','It always proves dehydration','It is unaffected by supplements','It replaces clinical assessment'],0,'Urine appearance can be influenced by multiple factors.'],
[4,'Infants','Why can infants be particularly vulnerable to dehydration?',['They have relatively high fluid needs per kilogram','They never lose water through skin','They do not require water','They have adult kidney function'],0,'Infants have high relative water requirements and can experience rapid fluid losses.'],
[4,'Older adults','Which change may increase dehydration risk in older adults?',['Reduced thirst sensation','Complete absence of water losses','Greater thirst reliability in all individuals','No need for fluids'],0,'Reduced thirst and practical barriers to fluid access can increase risk.'],
[4,'Lactation','Why do fluid requirements increase during lactation?',['Water is needed for breast milk production','Breast milk contains no water','Water replaces all dietary nutrients','The kidneys stop working'],0,'Breast milk production increases maternal fluid needs.'],
[4,'Illness','Which condition can increase both water and electrolyte losses?',['Vomiting and diarrhea','Normal sleep','Sitting in a cool room','Reading'],0,'Gastrointestinal illness can cause significant fluid and electrolyte losses.'],
[4,'Adequate Intake','Which statement about total water AI values is correct?',['They include water from foods and beverages','They refer only to plain water','They are identical for everyone','They exclude all food moisture'],0,'Total water AI values include beverages and moisture from foods.'],
[4,'Individual needs','Which factor can change daily fluid requirements?',['Physical activity and climate','Eye color alone','Blood type alone','Hair length'],0,'Activity, environmental conditions, and health status affect fluid needs.'],
[6,'Application','An athlete finishes a long event with substantial sweat losses. What is the most appropriate general principle?',['Replace fluid losses according to individual needs','Avoid all fluids','Drink unlimited water as quickly as possible','Ignore electrolyte losses'],0,'Fluid replacement should account for individual losses and avoid excessive intake.'],
[6,'Application','A person has persistent vomiting and diarrhea. Which concern is most relevant?',['Fluid and electrolyte depletion','Excess vitamin A absorption','Increased calcium storage','Improved hydration'],0,'Gastrointestinal losses can cause dehydration and electrolyte disturbances.'],
[6,'Regulation','A dehydrated person releases more ADH. What effect would be expected?',['Greater renal water reabsorption','Greater urinary water loss','Complete cessation of sodium regulation','Reduced thirst in every case'],0,'ADH promotes renal water conservation.'],
[6,'Osmosis','A cell is placed in a strongly hypertonic environment. What is the expected effect?',['Water leaves the cell','Water enters the cell indefinitely','No water can move','The cell produces dietary water'],0,'A hypertonic environment draws water out of cells.'],
[6,'Clinical','A person drinks very large volumes of plain water during prolonged exercise and develops confusion. Which condition is a concern?',['Exercise-associated hyponatremia','Scurvy','Pellagra','Beriberi'],0,'Excess water relative to excretion can contribute to low blood sodium.'],
[6,'Life cycle','An older adult reports rarely feeling thirsty. Which statement is most appropriate?',['Thirst may become less reliable with aging','Thirst always guarantees adequate intake','Older adults never become dehydrated','Only athletes need water'],0,'Reduced thirst sensation may increase dehydration risk.'],
[6,'Evaluation','Which is the best interpretation of a daily water AI?',['A population-based reference value, not an exact requirement for everyone','A mandatory amount of plain water for every person','A maximum safe intake','A treatment for all electrolyte disorders'],0,'Adequate Intake values help guide population recommendations but individual needs vary.'],
[6,'Synthesis','Which statement best connects water, sodium, and fluid balance?',['Sodium influences extracellular fluid osmolality and water distribution','Sodium has no relationship to water','Water cannot cross cell membranes','Only vitamins regulate fluid balance'],0,'Sodium is a major extracellular electrolyte involved in fluid distribution.']
];
const matches=[['Fluid regulation',[['ADH','Increases renal water reabsorption'],['Aldosterone','Promotes renal sodium reabsorption'],['Osmosis','Water movement across a selective membrane'],['Thirst','Behavioral drive to consume fluids']]],['Hydration concepts',[['Dehydration','Water losses exceed replacement'],['Hyponatremia','Low blood sodium concentration'],['Intracellular fluid','Water located inside cells'],['Extracellular fluid','Plasma and interstitial fluid']]]];
const key='nutr2351-ch11-water-v2';
let state;try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){state={}}state.answers ||= {};state.matches ||= {};let page=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function score(){let n=0;questions.forEach((q,i)=>{if(state.answers[i]===q[4])n++});matches.forEach((set,i)=>{set[1].forEach((pair,j)=>{if(state.matches[i+'-'+j]===pair[1])n++})});return n}
function progress(){const n=score();$('progressText').textContent=n+' of 40 challenges correct ('+Math.round(n/40*100)+'%)';$('bar').style.width=n/40*100+'%'}
function quiz(q,i){const chosen=state.answers[i],answered=Number.isInteger(chosen);return `<div class="question"><span class="pill">${esc(q[1])}</span><strong>${esc(q[2])}</strong>${q[3].map((choice,j)=>`<button class="option ${answered&&j===q[4]?'correct':''} ${answered&&j===chosen&&chosen!==q[4]?'wrong':''}" data-q="${i}" data-choice="${j}">${'ABCD'[j]}. ${esc(choice)}</button>`).join('')}${answered?`<div class="feedback"><b>${chosen===q[4]?'Correct!':'Not quite. Try again.'}</b><div>${esc(q[5])}</div></div>`:''}</div>`}
function practice(section){return questions.map((q,i)=>({q,i})).filter(x=>x.q[0]===section).map(x=>quiz(x.q,x.i)).join('')}
function overview(){return `<div class="panel"><span class="pill">Welcome</span><h2>Your interactive exam review</h2><p>This guide focuses on the foundational knowledge and applications of <b>Chapter 11: Water</b>. Because this chapter was completed through independent study, the activities help you identify what you understand and what you may need to revisit.</p><div class="note"><b>How to use this guide:</b> Read each short lesson, answer the practice questions, complete the matching lab, and finish the cumulative mastery challenge. Every answer provides feedback. Your progress is saved in this browser but is not submitted to Canvas.</div><h3>Water concepts at a glance</h3><div class="tablewrap"><table><thead><tr><th>Concept</th><th>What to remember</th></tr></thead><tbody><tr><td>Body water</td><td>Varies with age and body composition</td></tr><tr><td>Intracellular fluid</td><td>Approximately two-thirds of total body water</td></tr><tr><td>Extracellular fluid</td><td>Includes plasma and interstitial fluid</td></tr><tr><td>ADH</td><td>Promotes renal water conservation</td></tr><tr><td>Aldosterone</td><td>Promotes sodium reabsorption</td></tr><tr><td>Osmosis</td><td>Water movement driven by effective solute differences</td></tr><tr><td>Dehydration</td><td>Water losses exceed replacement</td></tr><tr><td>Hyponatremia</td><td>Low blood sodium concentration</td></tr><tr><td>Total water AI</td><td>Includes foods and beverages</td></tr></tbody></table></div><div class="note"><b>Study strategy:</b> Before answering a question, explain the concept in your own words. Then select your answer and read the feedback, even when you are correct.</div></div>`}
function lesson(section){const s=sections[section];let html=`<div class="panel"><span class="pill">Chapter 11 · Section ${section}</span><h2>${esc(s[0])}</h2><p class="muted">Review the key concepts before attempting the questions.</p>`;s.slice(1).forEach(item=>{html+=`<div class="lesson"><h3>${esc(item[0])}</h3><p>${esc(item[1])}</p></div>`});return html+`</div><div class="panel"><span class="pill">Active recall</span><h3>Check your understanding</h3><p class="muted">Select an answer for immediate feedback. You can retry questions as often as needed.</p>${practice(section)}</div>`}
function matching(){let html=`<div class="panel"><span class="pill">Matching lab</span><h2>Make the connections</h2><p>Match each term with the correct definition or function.</p>`;matches.forEach((set,i)=>{html+=`<h3>${esc(set[0])}</h3>`;set[1].forEach((pair,j)=>{const v=state.matches[i+'-'+j]||'';html+=`<div class="matchrow"><b>${esc(pair[0])}</b><select data-match="${i}-${j}"><option value="">Choose a match...</option>`;set[1].forEach(other=>{html+=`<option value="${esc(other[1])}" ${v===other[1]?'selected':''}>${esc(other[1])}</option>`});html+=`</select></div>`;if(v)html+=`<p class="muted">${v===pair[1]?'✓ Correct match.':'Not quite. Try another match.'}</p>`})});return html+'</div>'}
function mastery(){return `<div class="panel"><span class="pill">Cumulative synthesis</span><h2>Mastery challenge</h2><p>Apply water and fluid-balance concepts to integrated nutrition and clinical scenarios. These are original practice questions, not previous exam questions.</p><div class="note"><b>Your progress:</b> ${score()} of 40 challenges correct. Progress is stored only in this browser.</div>${practice(6)}<button class="option" id="reset" style="font-weight:bold;text-align:center;margin-top:22px">Reset all study progress</button></div>`}
function render(){$('nav').innerHTML=sections.map((s,i)=>`<button data-page="${i}" class="${i===page?'active':''}">${esc(s[0])}</button>`).join('');$('content').innerHTML=page===0?overview():page===5?matching():page===6?mastery():lesson(page);$('previous').disabled=page===0;$('next').disabled=page===6;document.querySelectorAll('[data-page]').forEach(b=>{b.onclick=()=>go(+b.dataset.page)});document.querySelectorAll('[data-q]').forEach(b=>{b.onclick=()=>{state.answers[+b.dataset.q]=+b.dataset.choice;save();render()}});document.querySelectorAll('[data-match]').forEach(s=>{s.onchange=()=>{state.matches[s.dataset.match]=s.value;save();render()}});const reset=$('reset');if(reset)reset.onclick=()=>{if(confirm('Clear all Chapter 11 study progress?')){state={answers:{},matches:{}};save();render()}};progress()}
function go(i){page=i;render();window.scrollTo({top:0,behavior:'smooth'})}
$('previous').onclick=()=>{if(page>0)go(page-1)};$('next').onclick=()=>{if(page<6)go(page+1)};render();
</script>
